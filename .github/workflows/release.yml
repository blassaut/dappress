# Publishes a version: push its tag, v<version>, once package.json and
# CHANGELOG.md have it. The package goes to npm, and the version's section of
# the changelog becomes the notes of a GitHub release.
#
# npm takes the package from this workflow as a trusted publisher (OIDC): no
# npm token is stored. The package's settings on npmjs.com name this
# repository and this file, release.yml.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      # The GitHub release
      contents: write
      # The identity npm checks, in place of a token
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later
      - run: npm install --global npm@latest

      - run: npm ci
        env:
          # Neither the checks nor the build start Cypress
          CYPRESS_INSTALL_BINARY: 0

      - name: The tag is the version of package.json, and the changelog has it
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag is $TAG and package.json says $version"
            exit 1
          fi
          npx tsx scripts/release-notes.ts "$version" > "$RUNNER_TEMP/notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The same checks as CI: nothing is published that a pull request would not pass
      - run: npm run check

      # prepack builds dist
      - run: npm publish --access public

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
