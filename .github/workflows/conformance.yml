# Checks every day whether MetaMask published a new release, and runs the
# conformance suite against it, in each mode, when it has no report yet. Run by
# hand with a version, or on a pull request that changes Dappress or the suite,
# it tests that release (or the latest) regardless.
#
# The reports, MATRIX.md and badge.json (a shields.io endpoint) are published
# on the conformance-reports branch, never on main. Pull requests only show
# the matrix in the run summary.
name: Conformance

on:
  pull_request:
    paths:
      - .github/workflows/conformance.yml
      - conformance/**
      - package*.json
      - tsconfig*.json
      - scripts/**
      - src/**
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: MetaMask release to test, e.g. 13.50.0 (default the latest, when it has no report yet)
        required: false

env:
  REPORTS_BRANCH: conformance-reports
  # Chrome majors whose own bug fails the suite whatever Dappress does, skipped
  # by scripts/install-chrome.sh until Chrome stable moves past them.
  # 155: kills its network service when a request ID is reused under DevTools
  # request interception, which Cypress uses; MetaMask's background restarts
  # and Cypress's tasks fail. crbug.com/559770861, fixed in 156.
  CHROME_BROKEN: '155'

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metamask.outputs.version }}
      run: ${{ steps.metamask.outputs.run }}
    steps:
      - uses: actions/checkout@v7

      - name: MetaMask release to test
        id: metamask
        env:
          REQUESTED: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
          # Authenticated, the API call isn't limited to the runner IP's 60 per hour
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$REQUESTED" ]; then
            version=$REQUESTED
          else
            version=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/MetaMask/metamask-extension/releases/latest | jq -r .tag_name | sed 's/^v//')
          fi
          # The version ends up in commands and file names, and comes from someone else's tag
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a MetaMask version: expected x.y.z"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$REQUESTED" ] || [ "$EVENT" = pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Done when the reports branch has a report for every mode
          missing=1
          if git fetch --depth=1 origin "$REPORTS_BRANCH" 2>/dev/null; then
            missing=0
            for mode in sidepanel headless popup; do
              git cat-file -e "FETCH_HEAD:reports/metamask-$version-$mode.json" 2>/dev/null || missing=1
            done
          fi
          if [ "$missing" = 0 ]; then
            echo "MetaMask $version already has a report for every mode, nothing to do"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  suite:
    needs: version
    if: needs.version.outputs.run == 'true'
    runs-on: ubuntu-24.04
    # A failing run is about seven minutes; a hung one shouldn't bill an hour
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # See scripts/modes.ts
        mode: [sidepanel, headless, popup]
        chrome: [stable]
        # Chrome for Testing's previous major too, once: a Chrome release that
        # changes how MetaMask shows its requests fails a job the day it ships
        include:
          - mode: headless
            chrome: previous
    name: suite (${{ matrix.mode }}${{ matrix.chrome == 'previous' && ', previous Chrome' || '' }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # @puppeteer/browsers installs Chrome for Testing; setup-chrome's
      # "stable" channel installs Google Chrome, which can't load MetaMask
      - name: Install Chrome for Testing
        id: chrome
        env:
          CHROME: ${{ matrix.chrome }}
        run: |
          path=$(scripts/install-chrome.sh "$CHROME")
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - uses: foundry-rs/foundry-toolchain@v1

      - run: npm ci

      - name: Run the suite against MetaMask ${{ needs.version.outputs.version }}, ${{ matrix.mode }}
        # The headless mode needs no display; Xvfb is harmless there
        run: xvfb-run --auto-servernum npm run conformance -- "$METAMASK_VERSION"
        env:
          METAMASK_VERSION: ${{ needs.version.outputs.version }}
          DAPPRESS_BROWSER: ${{ steps.chrome.outputs.path }}
          DAPPRESS_MODE: ${{ matrix.mode }}

      # The report of a mode is the one on the stable Chrome: the previous one only has to pass
      - uses: actions/upload-artifact@v7
        if: always() && matrix.chrome == 'stable'
        with:
          name: report-${{ needs.version.outputs.version }}-${{ matrix.mode }}
          # The report, and the wallet profile recorded during the suite
          path: |
            reports/metamask-${{ needs.version.outputs.version }}-${{ matrix.mode }}.json
            reports/profiles/metamask-${{ needs.version.outputs.version }}-${{ matrix.mode }}.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots-${{ needs.version.outputs.version }}-${{ matrix.mode }}-${{ matrix.chrome }}
          # Dappress saves what MetaMask showed when a command failed under /tmp/dappress
          path: /tmp/dappress
          if-no-files-found: ignore

  # The same suite on the mock wallet, replaying a profile: MetaMask's, where
  # every command has to pass, and the others', where what fails is what the
  # wallet does differently. Chrome for Testing, as the other modes, and Anvil.
  mock:
    needs: version
    if: needs.version.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        wallet: [metamask, rabby, phantom]
    name: mock (${{ matrix.wallet }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Chrome for Testing
        id: chrome
        run: |
          path=$(scripts/install-chrome.sh stable)
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - uses: foundry-rs/foundry-toolchain@v1

      - run: npm ci

      - name: Run the suite on the mock of ${{ matrix.wallet }}
        run: npm run conformance
        env:
          DAPPRESS_MODE: mock
          DAPPRESS_MOCK: ${{ matrix.wallet }}
          DAPPRESS_BROWSER: ${{ steps.chrome.outputs.path }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-mock-${{ matrix.wallet }}
          path: reports/mock-*.json
          if-no-files-found: ignore

  publish:
    needs: [version, suite, mock]
    # A failing mode still has its report published
    if: always() && needs.version.outputs.run == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: conformance-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci
        env:
          # The matrix doesn't start Cypress
          CYPRESS_INSTALL_BINARY: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: report-*
          merge-multiple: true
          path: incoming

      - name: Matrix of this run
        run: |
          mkdir -p incoming
          npm run matrix -- incoming run
          cat run/MATRIX.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish on ${{ env.REPORTS_BRANCH }}
        if: github.event_name != 'pull_request'
        env:
          METAMASK_VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin "$REPORTS_BRANCH" >/dev/null; then
            git fetch --depth=1 origin "$REPORTS_BRANCH"
            git worktree add published FETCH_HEAD
          else
            # First publication: start from the reports kept on main
            git worktree add --detach published
            git -C published checkout --orphan "$REPORTS_BRANCH"
            git -C published rm -rfq .
            cp -r reports published/reports
          fi
          mkdir -p published/reports/profiles
          cp incoming/*.json published/reports/ 2>/dev/null || true
          # The profiles recorded by hand live on main; the suite's own, fresher, come after
          cp reports/profiles/*.json published/reports/profiles/ 2>/dev/null || true
          cp incoming/profiles/*.json published/reports/profiles/ 2>/dev/null || true
          npm run matrix -- published/reports published
          cd published
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to publish"
            exit 0
          fi
          git commit -q -m "Conformance of MetaMask $METAMASK_VERSION"
          git push origin "HEAD:refs/heads/$REPORTS_BRANCH"
