# Checks every day whether MetaMask published a new release, and runs the
# conformance suite against it when there is no report for it yet. Run by
# hand with a version, it runs the suite against that release regardless.
name: Conformance

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: MetaMask release to test, e.g. 13.50.0 (default the latest, when it has no report yet)
        required: false

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Latest MetaMask release
        id: metamask
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          if [ -n "$REQUESTED" ]; then
            echo "version=$REQUESTED" >> "$GITHUB_OUTPUT"
            echo "new=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(curl -s https://api.github.com/repos/MetaMask/metamask-extension/releases/latest | jq -r .tag_name | sed 's/^v//')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -f "reports/metamask-$version.json" ]; then
            echo "MetaMask $version already has a report, nothing to do"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.metamask.outputs.new == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      # @puppeteer/browsers installs Chrome for Testing; setup-chrome's
      # "stable" channel installs Google Chrome, which can't load MetaMask
      - name: Install Chrome for Testing
        if: steps.metamask.outputs.new == 'true'
        id: chrome
        run: |
          path=$(npx --yes @puppeteer/browsers@3 install chrome@stable --path "$RUNNER_TEMP/browsers" --format '{{path}}' | tail -n 1)
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - if: steps.metamask.outputs.new == 'true'
        uses: foundry-rs/foundry-toolchain@v1
      - if: steps.metamask.outputs.new == 'true'
        run: npm ci

      - name: Run the suite against MetaMask ${{ steps.metamask.outputs.version }}
        if: steps.metamask.outputs.new == 'true'
        run: xvfb-run --auto-servernum npm run conformance -- ${{ steps.metamask.outputs.version }}
        env:
          DAPPRESS_BROWSER: ${{ steps.chrome.outputs.path }}

      - uses: actions/upload-artifact@v4
        if: always() && steps.metamask.outputs.new == 'true'
        with:
          name: report-metamask-${{ steps.metamask.outputs.version }}
          # Dappress saves what MetaMask showed when a command failed under /tmp/dappress
          path: |
            reports/
            /tmp/dappress
          if-no-files-found: ignore
